plugins {
    id 'java'
    id("com.github.johnrengelman.shadow") version "7.0.0"
}

group = 'org.example'
version = '1.0-SNAPSHOT'

repositories {
    mavenCentral()
}

dependencies {
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.13.3'
    implementation 'com.fasterxml.jackson.core:jackson-core:2.13.3'
    implementation 'org.java-websocket:Java-WebSocket:1.5.3'

    // Java-WebSocket이 slf4j-api를 요구한다. 이 앱은 로깅을 쓰지 않으므로
    // 바인딩만 no-op으로 채운다 (slf4j-log4j12는 EOL인 log4j 1.x를 900KB 끌고 온다).
    implementation 'org.slf4j:slf4j-nop:1.7.32'

    // Lombok은 @Getter/@Setter만 쓰고 런타임에는 필요 없으므로 fat jar에 포함하지 않는다.
    compileOnly('org.projectlombok:lombok:1.18.30')
    annotationProcessor('org.projectlombok:lombok:1.18.30')
}

shadowJar {
    archiveClassifier.set("all")
    manifest {
        attributes(
                'Main-Class': 'org.example.Main'
        )
    }
}

// 소스에 한글 주석이 있어서 인코딩을 명시한다.
// 명시하지 않으면 빌드하는 PC의 기본 문자셋(한국어 Windows는 CP949)에 따라 결과가 달라진다.
tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
